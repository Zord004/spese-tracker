# Deploy su Render (render.com). Railway e Fly.io funzionano in modo simile.
# Le variabili marcate sync:false vanno inserite a mano nella dashboard.
services:
  - type: web
    name: spese-tracker
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false
      - key: HOST
        value: 0.0.0.0
      # Attiva l'obbligo di autenticazione: senza BASIC_AUTH_* il server non parte
      - key: NODE_ENV
        value: production
